<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Premium AutoCare</title>


    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">


    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">


    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        :root {
            --sky-blue: #00b4db;
            --dark-blue: #0083b0;
            --error-red: #ef4444;
            --text-dark: #f8fafc;
            --text-gray: #94a3b8;
            --glass-bg: rgba(15, 23, 42, 0.75);
            --glass-border: rgba(255, 255, 255, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: #030712;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            overflow-x: hidden;
            padding: 100px 20px;
            position: relative;
        }


        .login-bg {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: url('./asset/c22.webp') center/cover no-repeat;
        }

        .login-overlay {
            position: fixed;
            inset: 0;
            z-index: 2;
            background: linear-gradient(135deg, rgba(3, 7, 18, 0.92) 0%, rgba(3, 7, 18, 0.7) 100%);
        }


        #bubbles-container {
            position: fixed;
            inset: 0;
            z-index: 3;
            pointer-events: none;
            overflow: hidden;
        }

        .bubble {
            position: absolute;
            bottom: -100px;
            background: rgba(255, 255, 255, 0.15);

            border-radius: 50%;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
            animation: rise linear infinite;
        }

        @keyframes rise {
            0% {
                transform: translateY(0) scale(0.5);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            80% {
                opacity: 1;
            }

            100% {
                transform: translateY(-120vh) scale(1.5);
                opacity: 0;
            }
        }


        .back-home {
            position: absolute;
            top: 30px;
            left: 30px;
            z-index: 100;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-dark);
            text-decoration: none;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 50px;
            border: 1px solid var(--glass-border);
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .back-home:hover {
            background: var(--sky-blue);
            border-color: var(--sky-blue);
            transform: translateX(-5px);
        }


        .login-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 460px;
        }

        .glass-form {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 45px 35px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
        }


        .form-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-header i {
            font-size: 2.5rem;
            color: var(--sky-blue);
            margin-bottom: 15px;
        }

        .form-header h2 {
            color: var(--text-dark);
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .form-header p {
            color: var(--text-gray);
            font-size: 0.95rem;
        }


        .input-group {
            margin-bottom: 22px;
            position: relative;
        }

        .input-wrapper {
            position: relative;
            width: 100%;
        }

        .input-wrapper i.left-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 1.05rem;
            transition: color 0.3s;
        }

        .input-wrapper select,
        .input-wrapper input {
            width: 100%;
            padding: 15px 20px 15px 48px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: var(--text-dark);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-wrapper select {
            appearance: none;
            cursor: pointer;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2300b4db' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'%3E%3C/polyline%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right 15px center;
            background-size: 16px;
        }

        .input-wrapper select option {
            background: #0f172a;
            color: #fff;
        }

        .input-wrapper input::placeholder {
            color: #64748b;
        }


        .input-wrapper input:focus,
        .input-wrapper select:focus {
            border-color: var(--sky-blue);
            background: rgba(0, 180, 219, 0.05);
            box-shadow: 0 0 15px rgba(0, 180, 219, 0.1);
        }

        .input-wrapper input:focus~i.left-icon,
        .input-wrapper select:focus~i.left-icon {
            color: var(--sky-blue);
        }


        input[type="password"]::-ms-reveal,
        input[type="password"]::-ms-clear {
            display: none !important;
        }


        .toggle-password {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            cursor: pointer;
            font-size: 1.1rem;
            transition: color 0.3s;
        }

        .toggle-password:hover {
            color: var(--sky-blue);
        }


        .error-message {
            color: var(--error-red);
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 6px;
            margin-left: 5px;
            display: none;
        }

        .input-group.error .input-wrapper input,
        .input-group.error .input-wrapper select {
            border-color: var(--error-red);
            background: rgba(239, 68, 68, 0.05);
            animation: shake 0.4s ease-in-out;
        }

        .input-group.error .error-message {
            display: block;
        }

        .input-group.error .input-wrapper i.left-icon {
            color: var(--error-red);
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25%,
            75% {
                transform: translateX(-5px);
            }

            50% {
                transform: translateX(5px);
            }
        }


        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-gray);
            cursor: pointer;
        }

        .remember input {
            accent-color: var(--sky-blue);
            width: 15px;
            height: 15px;
            cursor: pointer;
        }

        .forgot-link {
            color: var(--text-gray);
            text-decoration: none;
            transition: color 0.3s;
        }

        .forgot-link:hover {
            color: var(--sky-blue);
        }


        .submit-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, var(--sky-blue), var(--dark-blue));
            color: #fff;
            font-size: 1.05rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: all 0.3s;
            box-shadow: 0 10px 20px rgba(0, 180, 219, 0.3);
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(0, 180, 219, 0.5);
        }


        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 30px 0;
            color: #64748b;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        }

        .divider::before {
            margin-right: 15px;
        }

        .divider::after {
            margin-left: 15px;
        }


        .social-logins {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .social-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            font-size: 1.2rem;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .social-btn:hover {
            background: var(--sky-blue);
            border-color: var(--sky-blue);
            transform: translateY(-3px);
        }


        .signup-link {
            text-align: center;
            margin-top: 30px;
            font-size: 0.95rem;
            color: var(--text-gray);
        }

        .signup-link a {
            color: var(--sky-blue);
            font-weight: 700;
            text-decoration: none;
            margin-left: 5px;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }


        @media (max-width: 576px) {
            body {
                padding: 80px 15px 40px 15px;
            }

            .back-home {
                top: 15px;
                left: 15px;
                padding: 8px 15px;
                font-size: 0.85rem;
            }

            .glass-form {
                padding: 35px 25px;
            }

            .form-header h2 {
                font-size: 1.6rem;
            }
        }

        .logo {
            width: 150px;
        }
    </style>
</head>

<body>


    <div class="login-bg"></div>
    <div class="login-overlay"></div>


    <div id="bubbles-container"></div>


    <a href="index.html" class="back-home"><i class="fas fa-arrow-left"></i> Home</a>


    <div class="login-wrapper">
        <div class="glass-form">

            <div class="form-header">

                <a href="index.html"><img src="./asset/skybluelogo.webp" alt="logo" class="logo"></a>
                <h2>Welcome Back</h2>
                <p>Enter your details to access your dashboard</p>
            </div>

            <form id="autoLoginForm" novalidate>


                <div class="input-group" id="roleGroup">
                    <div class="input-wrapper">
                        <i class="fas fa-user-shield left-icon"></i>
                        <select id="role">
                            <option value="" disabled selected>Select Account Type</option>
                            <option value="customer">Vehicle Owner (Book & Track)</option>
                            <option value="admin">Service Admin (Manage Platform)</option>
                        </select>
                    </div>
                    <div class="error-message">Please select your account type.</div>
                </div>


                <div class="input-group" id="emailGroup">
                    <div class="input-wrapper">
                        <i class="far fa-envelope left-icon"></i>
                        <input type="email" id="email" placeholder="Email Address" autocomplete="off">
                    </div>
                    <div class="error-message">Please enter a valid email address.</div>
                </div>


                <div class="input-group" id="passwordGroup">
                    <div class="input-wrapper">
                        <i class="fas fa-lock left-icon"></i>
                        <input type="password" id="password" placeholder="Password (Min 6 chars)">
                        <i class="far fa-eye toggle-password" id="togglePassword"></i>
                    </div>
                    <div class="error-message">Password must be at least 6 characters.</div>
                </div>


                <div class="form-options">
                    <label class="remember"><input type="checkbox"> Remember Me</label>
                    <a href="404page.html" class="forgot-link">Forgot Password?</a>
                </div>


                <button type="submit" class="submit-btn">
                    <span>Secure Login</span> <i class="fas fa-arrow-right"></i>
                </button>
            </form>

            <div class="divider">Or Continue With</div>

            <div class="social-logins">
                <a href="404page.html" class="social-btn"><i class="fab fa-google"></i></a>
                <a href="404page.html" class="social-btn"><i class="fab fa-apple"></i></a>
                <a href="404page.html" class="social-btn"><i class="fab fa-facebook-f"></i></a>
            </div>

            <div class="signup-link">
                Don't have an account? <a href="signup.html">Sign Up Now</a>
            </div>

        </div>
    </div>


    <script>
        document.addEventListener("DOMContentLoaded", () => {

            const bubblesContainer = document.getElementById('bubbles-container');
            const bubbleCount = 25;
            if (bubblesContainer) {
                for (let i = 0; i < bubbleCount; i++) {
                    let bubble = document.createElement('div');
                    bubble.classList.add('bubble');
                    let size = Math.random() * 30 + 10 + 'px';
                    bubble.style.width = size; bubble.style.height = size;
                    bubble.style.left = Math.random() * 100 + 'vw';
                    bubble.style.animationDuration = Math.random() * 6 + 6 + 's';
                    bubble.style.animationDelay = Math.random() * 5 + 's';
                    bubblesContainer.appendChild(bubble);
                }
            }


            gsap.from(".glass-form", { opacity: 0, y: 40, duration: 1, ease: "power3.out" });
            gsap.from(".glass-form > *, #autoLoginForm > *", {
                opacity: 0, y: 15, duration: 0.6, stagger: 0.1,
                ease: "power2.out", delay: 0.2, clearProps: "all"
            });


            const loginForm = document.getElementById("autoLoginForm");
            const roleInput = document.getElementById("role");
            const emailInput = document.getElementById("email");
            const passwordInput = document.getElementById("password");

            const roleGroup = document.getElementById("roleGroup");
            const emailGroup = document.getElementById("emailGroup");
            const passwordGroup = document.getElementById("passwordGroup");


            const togglePassword = document.getElementById("togglePassword");
            if (togglePassword) {
                togglePassword.addEventListener("click", function () {
                    const type = passwordInput.getAttribute("type") === "password" ? "text" : "password";
                    passwordInput.setAttribute("type", type);
                    this.classList.toggle("fa-eye");
                    this.classList.toggle("fa-eye-slash");
                });
            }


            if (roleInput) roleInput.addEventListener("change", () => roleGroup.classList.remove("error"));
            if (emailInput) emailInput.addEventListener("input", () => emailGroup.classList.remove("error"));
            if (passwordInput) passwordInput.addEventListener("input", () => passwordGroup.classList.remove("error"));


            if (loginForm) {
                loginForm.addEventListener("submit", (e) => {
                    e.preventDefault();
                    let isValid = true;

                    if (roleInput.value === "") { roleGroup.classList.add("error"); isValid = false; }

                    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                    if (!emailRegex.test(emailInput.value.trim())) { emailGroup.classList.add("error"); isValid = false; }

                    if (passwordInput.value.trim().length < 6) { passwordGroup.classList.add("error"); isValid = false; }


                    if (isValid) {




                        sessionStorage.setItem('userEmail', emailInput.value.trim());

                        const btn = document.querySelector(".submit-btn");
                        btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> <span>Authenticating...</span>';
                        btn.style.opacity = "0.8";
                        btn.style.pointerEvents = "none";

                        const selectedRole = roleInput.value;


                        setTimeout(() => {
                            if (selectedRole === "customer") {
                                window.location.href = "customer_dashboard.html";
                            } else if (selectedRole === "admin") {
                                window.location.href = "admin_dashboard.html";
                            }
                        }, 1500);
                    }
                });
            }
        });
    </script>
</body>

</html>
